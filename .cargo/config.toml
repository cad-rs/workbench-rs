# workbench-rs local build configuration
#
# PYO3_PYTHON: the Python interpreter used by pyo3's build script
# (a full installation with libs/ and include/ is required).
# The value below is the development machine's miniforge3 path — on other
# machines, either:
#   1) change it to your interpreter path, or
#   2) delete this section and keep `python` on PATH (pyo3 auto-detects), or
#   3) override via the PYO3_PYTHON environment variable.
[env]
PYO3_PYTHON = "C:/ProgramData/miniforge3/python.exe"

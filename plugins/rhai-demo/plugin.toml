# Rhai script plugin demo: commands (sync/background), toolbar contributions and a custom
# script UI panel.
[plugin]
id = "com.example.demo"
name = "Rhai Demo Plugin"
version = "0.1.0"
api_version = "1"
entry_point = "plugin.rhai"

[compatibility]
products = ["*"]

[permissions]
document_read = false
document_write = false
filesystem_read = false
network = false

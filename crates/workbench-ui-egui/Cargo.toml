[package]
name = "workbench-ui-egui"
description = "egui frontend adapter for workbench-rs (eframe glow backend + egui_tiles docking)"
keywords = ["egui", "gui", "workbench", "docking"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
workbench-api = { workspace = true }
workbench-core = { workspace = true }
egui = { workspace = true }
eframe = { workspace = true }
egui_tiles = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# SVG 图标光栅化（0.48 与 gpui-ce 共用同一版本，不引入重复编译）
resvg = "0.48"
# std::time 在 wasm 上不可用；web-time 桌面转发 std、Web 走 performance.now
web-time = { workspace = true }

# Web (wasm32) 入口（eframe::WebRunner 的 async 驱动 + 同源 CJK 字体 fetch）
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
web-sys = { workspace = true, features = ["Response"] }

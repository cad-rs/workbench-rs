[package]
name = "workbench-api"
description = "GUI-agnostic platform contracts for workbench-rs: commands, tasks, documents, workspace/Ribbon model, painting abstraction"
keywords = ["gui", "workbench", "desktop", "commands", "plugins"]
categories = ["gui", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
web-time = { workspace = true }

# Desktop async timer (wb::sleep)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-io = { workspace = true }

# Web async timer via performance.now + setTimeout (wb::sleep)
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

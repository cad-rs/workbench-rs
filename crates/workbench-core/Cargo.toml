[package]
name = "workbench-core"
description = "Platform runtime for workbench-rs: product assembly, command dispatch, task pump, autosave/crash recovery, layout persistence"
keywords = ["gui", "workbench", "desktop", "commands", "plugins"]
categories = ["gui", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
workbench-api = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }

# 桌面专属：本地文件对话框与本地文件存储（Web 无）、async-io 计时器驱动共享执行器
# （async-io 2.6 的 rustix/errno 链不支持 wasm32-unknown-unknown）
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
async-io = { workspace = true }
async-executor = { workspace = true }
futures-lite = { workspace = true }
blocking = { workspace = true }
# OAuth device-flow HTTP (account integration; desktop only — the web build
# gets a stub AccountService from its product, if any).
ureq = { workspace = true }

# Web (wasm32): async executor drives futures on the main thread; app state
# (settings, layout) lives in localStorage; documents in OPFS; import/export
# through the browser's file chooser and downloads
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    # app state
    "Storage",
    # OPFS document storage
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "WritableStream",
    "DomException",
    # import (file chooser) / export (download)
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FileList",
    "File",
    "Blob",
    "Url",
    "EventTarget",
] }

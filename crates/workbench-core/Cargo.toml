[package]
name = "workbench-core"
description = "Platform runtime for workbench-rs: product assembly, command dispatch, task pump, autosave/crash recovery, layout persistence"
keywords = ["gui", "workbench", "desktop", "commands", "plugins"]
categories = ["gui", "development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
log = { workspace = true }
workbench-api = { workspace = true }
# Shared product infrastructure (atomic whole-file writes, storage/picker).
product-kit = { path = "../../../../product-kit" }
serde = { workspace = true }
serde_json = { workspace = true }
toml = { workspace = true }
# Browser sign-in
base64 = { workspace = true }
form_urlencoded = { workspace = true }
sha2 = { workspace = true }

# Desktop only: native file dialogs and local file storage (none on the web), and the async-io
# timer driving the shared executor (async-io 2.6's rustix/errno chain does not support
# wasm32-unknown-unknown)
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rfd = { workspace = true }
async-io = { workspace = true }
async-executor = { workspace = true }
futures-lite = { workspace = true }
blocking = { workspace = true }
# Log file and crash reports
chrono = { workspace = true }
env_logger = { workspace = true }
# OAuth device-flow HTTP (account integration; desktop only — the web build
# gets a stub AccountService from its product, if any).
ureq = { workspace = true }
getrandom = { workspace = true }

# Web (wasm32): async executor drives futures on the main thread; app state
# (settings, layout) lives in localStorage; documents in OPFS; import/export
# through the browser's file chooser and downloads
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen-futures = { workspace = true }
js-sys = { workspace = true }
wasm-bindgen = { workspace = true }
web-sys = { workspace = true, features = [
    # app state
    "Storage",
    # OPFS document storage
    "Navigator",
    "StorageManager",
    "FileSystemDirectoryHandle",
    "FileSystemFileHandle",
    "FileSystemGetDirectoryOptions",
    "FileSystemGetFileOptions",
    "FileSystemHandle",
    "FileSystemHandleKind",
    "FileSystemWritableFileStream",
    "WritableStream",
    "DomException",
    # import (file chooser) / export (download)
    "Document",
    "Element",
    "HtmlElement",
    "HtmlInputElement",
    "HtmlAnchorElement",
    "FileList",
    "File",
    "Blob",
    "Url",
    "EventTarget",
    # asking before leaving with unsaved work
    "BeforeUnloadEvent",
    # browser sign-in
    "Crypto",
    "Headers",
    "Location",
    "Request",
    "RequestInit",
    "Response",
] }

[package]
name = "workbench-ui"
description = "gpui frontend for workbench-rs (gpui-fast + gpui-component + gpui-rhai script views)"
keywords = ["gpui", "gui", "workbench", "desktop"]
categories = ["gui"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
log = { workspace = true }
workbench-api = { workspace = true }
workbench-core = { workspace = true }
# RibbonBar component (a pure gpui component with no workbench dependency; the bridge is in
# src/ribbon_bridge.rs)
ribbon = { workspace = true }
gpui = { workspace = true }
gpui-component = { workspace = true }
gpui-component-assets = { workspace = true }
gpui-rhai = { workspace = true }
serde_json = { workspace = true }
# std::time is unavailable on wasm; web-time forwards to std on desktop and uses
# performance.now on the web
web-time = { workspace = true }
anyhow = { workspace = true }
# Window icon decode (product.toml `window_icon`). gpui depends on it on every
# target anyway; the web build only names the type.
image = { workspace = true }

# GPU viewport (native view extension; the gpu_view module; the host Element uses the render core)
workbench-render = { workspace = true }
wgpu = { workspace = true }
glam = { workspace = true }
bytemuck = { workspace = true }

# Web (wasm32): async driver (font prefetch goes through wb::asyncrt::fetch_bytes)
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
# On the web GPUI's renderer is wgpu itself: the GPU viewport renders on GPUI's own device into a
# WgpuDynamicTexture, which joins the draw order as an ordinary sprite. Getting that context takes
# the concrete WebPlatform (gpui_platform's web constructor doesn't hand it back), hence the direct
# dependency on gpui_web.
gpui-wgpu = { workspace = true }
gpui-web = { workspace = true }
wgpu = { workspace = true, features = ["webgpu"] }
# WindowOptions::icon 在所有平台都存在；web 只是永远解码不出图标（没有资产
# 时返回 None），所以这里只需要一个能编译的 png 子集。
image = { workspace = true, default-features = false, features = ["png"] }

# Desktop: the platform layer (the web builds its own WebPlatform, bypassing gpui_platform); the
# GPU viewport creates its own wgpu device (GPUI is D3D11 on Windows and Metal on macOS, so there
# is no wgpu device to share).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
gpui-platform = { workspace = true }
pollster = { workspace = true }

# Windows: the viewport's wgpu swap chain hangs on a DirectComposition visual in the GPUI window's
# composition. The version must match gpui_windows': the native surface handle is handed out as
# this crate's IUnknown and recovered via Any::downcast.
[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "0.62", features = ["Win32_Graphics_DirectComposition"] }

[dev-dependencies]
# The splitter-drag unit tests need a real Runtime (panel registration + the area_active lookup
# path)
workbench-example = { workspace = true }

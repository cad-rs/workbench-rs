[package]
name = "workbench-rhai"
description = "Rhai script plugin host for workbench-rs: manifest discovery, Host API v1, command + script-panel registration"
keywords = ["rhai", "scripting", "plugin", "workbench"]
categories = ["development-tools"]
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme = "../../README.md"

[dependencies]
workbench-api = { workspace = true }
workbench-core = { workspace = true }
# The shared plugin host (manifest, Rhai engines, loading pipeline), consumed
# through product-kit like the rest of the shared infrastructure. This crate is
# the workbench adapter that commits into the Registry.
plugin-host = { path = "../../../../product-kit/crates/plugin-host" }

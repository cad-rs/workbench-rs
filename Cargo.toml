[workspace]
resolver = "2"
members = [
    "crates/workbench-api",
    "crates/workbench-core",
    "crates/workbench-render",
    "crates/workbench-rhai",
    "crates/ribbon",
    "crates/ribbon-demo",
    "crates/workbench-ui",
    "workbenches/wb-example",
    "products/product-demo",
    "products/product-web",
]
exclude = [".vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cad-rs/workbench-rs"

[workspace.dependencies]
# Internal crates (path + version dual declaration so member crates can be
# published to crates.io directly)
workbench-api = { path = "crates/workbench-api", version = "0.1.0" }
workbench-core = { path = "crates/workbench-core", version = "0.1.0" }
workbench-render = { path = "crates/workbench-render", version = "0.1.0" }
workbench-ui = { path = "crates/workbench-ui", version = "0.1.0" }
workbench-rhai = { path = "crates/workbench-rhai", version = "0.1.0" }
workbench-example = { path = "workbenches/wb-example", version = "0.1.0" }
ribbon = { path = "crates/ribbon", version = "0.1.0" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
env_logger = "0.11"
# OAuth device-flow HTTP client (account integration; desktop targets).
ureq = "3"

# Platform async executor (phase 2: Async commands)
async-executor = "1"
async-io = "2"
futures-lite = "2"
# Local file I/O off the executor threads (desktop storage provider)
blocking = "1"

# Rhai script plugin host (phase 3)
rhai = { version = "=1.26.0", features = ["internals", "metadata", "serde"] }
toml = "0.9"

# Web (wasm32) build support (target-gated; versions align with eframe's tree)
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
console_error_panic_hook = "0.1"
# std::time::Instant/SystemTime panic on wasm32-unknown-unknown; web-time forwards to std on
# the desktop and uses performance.now/Date on the web
web-time = "1"

# gpui frontend: gpui-fast (longbridge/gpui-fast, a performance fork of Zed's
# GPUI), main branch. Main, not the crates.io release (0.1.13), because the
# web GPU viewport needs `WebPlatform::wgpu_context` (#102) and
# `WgpuDynamicTexture` (#86/#99), which no release carries yet. Once a
# release does, these can move to `gpui-fast*` from crates.io.
#
# Every `rev` below — here, in [patch.crates-io] and in
# .vendor/gpui-pre-compat — must be the same commit, or Cargo builds two gpui
# cores whose types don't mix.
gpui = { git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4" }
# No default features: the default `multithreaded` needs wasm threads
# (nightly + a cross-origin-isolated page). x11/wayland only take effect on
# Linux, font-kit only on macOS.
gpui-platform = { package = "gpui_platform", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4", default-features = false, features = [
    "font-kit",
    "x11",
    "wayland",
] }
# Web only: GPUI's own wgpu context (`WgpuContext` / `WgpuDynamicTexture`),
# which the web GPU viewport renders on, and the concrete web platform that
# hands that context out.
gpui-wgpu = { package = "gpui_wgpu", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4" }
gpui-web = { package = "gpui_web", git = "https://github.com/longbridge/gpui-fast", rev = "a10f393d8033c5f52f34821d6a25cddadc6174b4", default-features = false }
# GPUI Kit's component layer, from crates.io. It is built on the default
# backend (`gpui-pre` =0.3.11), which [patch.crates-io] points at gpui-fast.
gpui-component = "0.9.0"
gpui-component-assets = { package = "gpui-kit-assets", version = "0.9.0" }
# Rhai script views. Resolves to the vendored copy (see
# [patch.crates-io]), whose `gpui-pre` pin is moved to =0.3.11. 0.4.2 gates its
# backends behind features, so `gpui-pre` is named explicitly.
gpui-rhai = { version = "=0.4.2", default-features = false, features = ["gpui-pre"] }

# GPU viewport (workbench-ui's native view extension). The version must match the wgpu
# gpui-fast pins: the web viewport uses GPUI's device and textures directly, so the types
# must be the same.
wgpu = { git = "https://github.com/gfx-rs/wgpu", rev = "cddb2f5d80dc0009b2ef6767635140cacf90a007" }
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# Window icon decoding; the readback present path (offscreen render → CPU readback →
# paint_image)
image = "0.25"
# Desktop GPU viewport device creation (blocking wait for adapter/device)
pollster = "0.4"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release build tuning
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

[patch.crates-io]
# One gpui core for the whole graph. The registry crates that build on GPUI
# name it through the `gpui-pre-*` snapshot packages; these entries swap each
# snapshot for a re-export of gpui-fast, so their types are this workspace's.
#
# gpui-component 0.9 pins the =0.3.11 snapshot. gpui-fast's own compat crates
# still carry 0.3.9, so local copies at 0.3.11 stand in (see
# .vendor/gpui-pre-compat). Drop them once gpui-fast moves its compat crates
# to the snapshot gpui-component pins.
gpui-pre = { path = ".vendor/gpui-pre-compat/gpui-pre" }
gpui-pre-macros = { path = ".vendor/gpui-pre-compat/gpui-pre-macros" }
gpui-pre-platform = { path = ".vendor/gpui-pre-compat/gpui-pre-platform" }
gpui-pre-sum-tree = { path = ".vendor/gpui-pre-compat/gpui-pre-sum-tree" }
# gpui-rhai 0.4.2 still pins the older =0.3.9 snapshot on its default backend,
# and Cargo admits only one semver-compatible `gpui-pre` per graph. The vendored
# copy is the published 0.4.2 package with that pin moved to =0.3.11,
# gpui-fast's keystroke API and wasm32 fixes (listed at the top of its
# Cargo.toml). Its `gpui-fast` feature is no way out: it pins gpui-fast =0.1.9,
# whose keystroke API predates the core this workspace builds on. Drop the
# vendored copy once a release pins the snapshot gpui-component does, matches
# this core's keystroke API and builds for wasm.
gpui-rhai = { path = ".vendor/gpui-rhai" }

# gpui-fast's own workspace patches. Patches don't cross workspaces, so a
# git dependency on gpui-fast has to repeat them (as its wgpu demo does).
async-process = { git = "https://github.com/zed-industries/async-process.git", rev = "0b6d6713570af61806e1e5cb40e0f757cb93fd9d" }
async-task = { git = "https://github.com/zed-industries/async-task.git", rev = "015845a19fc31752c02367567d3b8900a406f9da" }
windows-capture = { git = "https://github.com/zed-industries/windows-capture.git", rev = "f0d6c1b6691db75461b732f6d5ff56eed002eeb9" }
calloop = { git = "https://github.com/zed-industries/calloop" }
khronos-egl = { git = "https://github.com/zed-industries/khronos-egl", rev = "42214b36347b108fd9630ca6254b96dde59e04fe" }

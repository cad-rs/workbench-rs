[workspace]
resolver = "2"
members = [
    "crates/workbench-api",
    "crates/workbench-core",
    "crates/workbench-python",
    "crates/workbench-ui-egui",
    "crates/workbench-ui-gpui",
    "workbenches/wb-example",
    "products/product-egui-demo",
    "products/product-gpui-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# 内部 crate
workbench-api = { path = "crates/workbench-api" }
workbench-core = { path = "crates/workbench-core" }
workbench-ui-egui = { path = "crates/workbench-ui-egui" }
workbench-ui-gpui = { path = "crates/workbench-ui-gpui" }
workbench-python = { path = "crates/workbench-python" }
wb-example = { path = "workbenches/wb-example" }

# 通用
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
env_logger = "0.11"

# 平台异步执行器（阶段 2：Async 命令）
async-executor = "1"
async-io = "2"
futures-lite = "2"

# Python 插件宿主（阶段 3）
pyo3 = { version = "0.29", features = ["auto-initialize"] }
toml = "0.9"

# egui 前端（glow 后端：Windows 上呈现路径兼容性更好，且与屏幕捕获兼容）
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "glow",
    "__screenshot",
] }
egui_tiles = "0.17"

# gpui 前端（gpui-ce 社区版，官方 README 推荐组合）
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui-platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit"] }
gpui-component = { package = "gpui_ce_components", version = "0.2.0" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "0.2.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# 阶段 5：发布构建调优
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

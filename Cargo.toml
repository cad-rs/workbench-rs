[workspace]
resolver = "2"
members = [
    "crates/workbench-api",
    "crates/workbench-core",
    "crates/workbench-rhai",
    "crates/workbench-ui",
    "workbenches/wb-example",
    "products/product-demo",
    "products/product-web",
]
exclude = [".vendor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cad-rs/workbench-rs"

[workspace.dependencies]
# Internal crates (path + version dual declaration so member crates can be
# published to crates.io directly)
workbench-api = { path = "crates/workbench-api", version = "0.1.0" }
workbench-core = { path = "crates/workbench-core", version = "0.1.0" }
workbench-ui = { path = "crates/workbench-ui", version = "0.1.0" }
workbench-rhai = { path = "crates/workbench-rhai", version = "0.1.0" }
workbench-example = { path = "workbenches/wb-example", version = "0.1.0" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
env_logger = "0.11"

# Platform async executor (phase 2: Async commands)
async-executor = "1"
async-io = "2"
futures-lite = "2"

# Rhai script plugin host (phase 3)
rhai = { version = "=1.26.0", features = ["internals", "metadata", "serde"] }
toml = "0.9"

# Web (wasm32) build support (target-gated; versions align with eframe's tree)
js-sys = "0.3"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window"] }
console_error_panic_hook = "0.1"
# std::time::Instant/SystemTime 在 wasm32-unknown-unknown 上 panic；web-time 桌面转发
# std、Web 端走 performance.now/Date
web-time = "1"

# gpui frontend (gpui-ce community fork; the single UI framework).
# Base is a vendored copy of javagg/gpui-ce (main @ 8ffa9a7 + the
# windows-wgpu-renderer branch patches) plus a compatibility-patched
# gpui-component — see .vendor/ (mirrors D:\srcs\gpui-wgpu, the known-good
# gpui+wgpu reference). Once the wgpu fixes land upstream and on crates.io,
# switch these entries back to the registry versions and drop .vendor/.
gpui = { package = "gpui-ce", path = ".vendor/gpui-ce/crates/gpui", features = [
    "custom-gpu",
    "wgpu-surfaces",
] }
gpui-platform = { package = "gpui_ce_platform", path = ".vendor/gpui-ce/crates/gpui_platform", features = [
    "windows-wgpu",
] }
# GPUI 渲染器的 wgpu 上下文（GPU 视口零拷贝通路：WgpuContextHandle /
# WgpuRenderTarget），Windows 与 Web 与 gpui 共享设备时使用。
gpui-wgpu = { package = "gpui_ce_wgpu", path = ".vendor/gpui-ce/crates/gpui_wgpu", features = [
    "custom-gpu",
    "wgpu-surfaces",
] }
gpui-component = { package = "gpui_ce_components", path = ".vendor/gpui-component/crates/ui" }
gpui-component-assets = { package = "gpui_ce_components_assets", path = ".vendor/gpui-component/crates/assets" }

# GPU 视口（workbench-ui 的原生视图扩展）：wgpu 版本必须与 vendored
# gpui-ce pin 的一致（当前 29.0.3），否则类型不同一、纹理无法共享。
wgpu = "29.0.3"
glam = "0.30"
bytemuck = { version = "1", features = ["derive"] }
# 非 Windows 桌面的回读合成路径（离屏渲染 → CPU 回读 → paint_image）
image = "0.25"
pollster = "0.4"
anyhow = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release build tuning
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

# Unify gpui-ce for registry dependencies that pin it (gpui-rhai =0.2.2):
# the vendored fork carries the same version number.

# Unify every vendored gpui-ce/gpui-component internal crate name, so no
# registry duplicate can slip into the graph (version skew breaks builds).
[patch.crates-io]
gpui-rhai = { path = ".vendor/gpui-rhai" }
gpui-ce = { path = ".vendor/gpui-ce/crates/gpui" }
gpui-component-story = { path = ".vendor/gpui-component/crates/story" }
gpui-component-story-web = { path = ".vendor/gpui-component/crates/story-web" }
gpui_ce_apple = { path = ".vendor/gpui-ce/crates/gpui_apple" }
gpui_ce_collections = { path = ".vendor/gpui-ce/crates/gpui_collections" }
gpui_ce_components = { path = ".vendor/gpui-component/crates/ui" }
gpui_ce_components_assets = { path = ".vendor/gpui-component/crates/assets" }
gpui_ce_components_base = { path = ".vendor/gpui-component/crates/base" }
gpui_ce_components_fps = { path = ".vendor/gpui-component/crates/fps" }
gpui_ce_components_macros = { path = ".vendor/gpui-component/crates/macros" }
gpui_ce_components_shell = { path = ".vendor/gpui-component/crates/shell" }
gpui_ce_components_webview = { path = ".vendor/gpui-component/crates/webview" }
gpui_ce_derive_refineable = { path = ".vendor/gpui-ce/crates/gpui_derive_refineable" }
gpui_ce_elements = { path = ".vendor/gpui-ce/crates/gpui_elements" }
gpui_ce_linux = { path = ".vendor/gpui-ce/crates/gpui_linux" }
gpui_ce_macos = { path = ".vendor/gpui-ce/crates/gpui_macos" }
gpui_ce_macros = { path = ".vendor/gpui-ce/crates/gpui_macros" }
gpui_ce_media = { path = ".vendor/gpui-ce/crates/gpui_media" }
gpui_ce_path = { path = ".vendor/gpui-ce/crates/gpui_path" }
gpui_ce_platform = { path = ".vendor/gpui-ce/crates/gpui_platform" }
gpui_ce_refineable = { path = ".vendor/gpui-ce/crates/gpui_refineable" }
gpui_ce_render = { path = ".vendor/gpui-ce/crates/gpui_render" }
gpui_ce_scheduler = { path = ".vendor/gpui-ce/crates/gpui_scheduler" }
gpui_ce_shared_string = { path = ".vendor/gpui-ce/crates/gpui_shared_string" }
gpui_ce_sum_tree = { path = ".vendor/gpui-ce/crates/gpui_sum_tree" }
gpui_ce_tokio = { path = ".vendor/gpui-ce/crates/gpui_tokio" }
gpui_ce_util = { path = ".vendor/gpui-ce/crates/gpui_ce_util" }
gpui_ce_web = { path = ".vendor/gpui-ce/crates/gpui_web" }
gpui_ce_wgpu = { path = ".vendor/gpui-ce/crates/gpui_wgpu" }
gpui_ce_windows = { path = ".vendor/gpui-ce/crates/gpui_windows" }
gpui_ce_zed_util = { path = ".vendor/gpui-ce/crates/gpui_zed_util" }

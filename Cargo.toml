[workspace]
resolver = "2"
members = [
    "crates/workbench-api",
    "crates/workbench-core",
    "crates/workbench-python",
    "crates/workbench-ui-egui",
    "crates/workbench-ui-gpui",
    "workbenches/wb-example",
    "products/product-egui-demo",
    "products/product-gpui-demo",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/cad-rs/workbench-rs"

[workspace.dependencies]
# Internal crates (path + version dual declaration so member crates can be
# published to crates.io directly)
workbench-api = { path = "crates/workbench-api", version = "0.1.0" }
workbench-core = { path = "crates/workbench-core", version = "0.1.0" }
workbench-ui-egui = { path = "crates/workbench-ui-egui", version = "0.1.0" }
workbench-ui-gpui = { path = "crates/workbench-ui-gpui", version = "0.1.0" }
workbench-python = { path = "crates/workbench-python", version = "0.1.0" }
workbench-example = { path = "workbenches/wb-example", version = "0.1.0" }

# Common
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rfd = "0.15"
env_logger = "0.11"

# Platform async executor (phase 2: Async commands)
async-executor = "1"
async-io = "2"
futures-lite = "2"

# Python plugin host (phase 3)
pyo3 = { version = "0.29", features = ["auto-initialize"] }
toml = "0.9"

# egui frontend (glow backend: more conservative presentation path on Windows)
egui = "0.36"
eframe = { version = "0.36", default-features = false, features = [
    "accesskit",
    "default_fonts",
    "links",
    "glow",
] }
egui_tiles = "0.17"

# gpui frontend (gpui-ce community fork; the official README combination)
gpui = { package = "gpui-ce", version = "0.2.2" }
gpui-platform = { package = "gpui_ce_platform", version = "0.1.0", features = ["font-kit"] }
gpui-component = { package = "gpui_ce_components", version = "0.2.0" }
gpui-component-assets = { package = "gpui_ce_components_assets", version = "0.2.0" }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# Release build tuning
[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"

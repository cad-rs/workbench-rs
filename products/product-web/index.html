<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench Demo - gpui (Web)</title>

    <!-- Copy assets/ (optional: fonts for text fallback) into dist/ -->
    <link data-trunk rel="copy-dir" href="assets" />

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #292b30;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0a5af;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            /* The canvas gpui_web mounts sits at the end of body, unpositioned; keep this
               underneath so the app's first frame naturally covers it */
            z-index: -1;
        }
    </style>
</head>

<body>
    <!-- Runs before the module script trunk injects: captures console output during wasm
         startup, for diagnosis in embedded/headless environments (gpui_web logs to the
         console) -->
    <script>
        window.__logs = [];
        (function () {
            var orig = {};
            ["log", "info", "warn", "error"].forEach(function (level) {
                orig[level] = console[level].bind(console);
                console[level] = function () {
                    try {
                        var msg = Array.prototype.map.call(arguments, function (a) {
                            return a && a.stack ? a.stack : String(a);
                        }).join(" | ");
                        window.__logs.push(level + ": " + msg);
                        if (window.__logs.length > 200) window.__logs.shift();
                    } catch (e) {}
                    orig[level].apply(null, arguments);
                };
            });
            window.addEventListener("error", function (e) {
                window.__logs.push("window.onerror: " + (e.message || e.filename));
            });
            window.addEventListener("unhandledrejection", function (e) {
                window.__logs.push("unhandledrejection: " +
                    ((e.reason && (e.reason.message || String(e.reason))) || ""));
            });
        })();
    </script>
    <div id="loading">Loading Workbench Demo… (gpui web needs a browser with WebGPU support)</div>
    <!-- gpui_web creates and mounts its own <canvas> after startup -->
</body>

</html>

<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench Demo - gpui (Web)</title>

    <!-- Copy assets/ (optional: fonts for text fallback) into dist/ -->
    

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #292b30;
            overflow: hidden;
        }

        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0a5af;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            /* gpui_web 挂载的 canvas 在 body 末尾、无定位；放在底层，
               应用首帧绘制后自然被覆盖 */
            z-index: -1;
        }
    </style>
<link rel="modulepreload" href="/product-web-6c8905c1470d71fa.js" crossorigin="anonymous" integrity="sha384-CvxxsBHDzikPJESdIkyb+D3ZiTqKKN6+TsrhJ4hKzTxlzWzZi6moACN4UXX01iS3"><link rel="preload" href="/product-web-6c8905c1470d71fa_bg.wasm" crossorigin="anonymous" integrity="sha384-YBoJTL2pEUy3V4fxWCiijugVUOEDa7d7iljqlUlhhCgikGpnCNJUYu9dPSdBX8Wx" as="fetch" type="application/wasm"></head>

<body>
    <!-- 先于 trunk 注入的 module 脚本执行：捕获 wasm 启动期 console 输出，
         便于在内嵌/无头环境诊断（gpui_web 的日志走 console） -->
    <script>
        window.__logs = [];
        (function () {
            var orig = {};
            ["log", "info", "warn", "error"].forEach(function (level) {
                orig[level] = console[level].bind(console);
                console[level] = function () {
                    try {
                        var msg = Array.prototype.map.call(arguments, function (a) {
                            return a && a.stack ? a.stack : String(a);
                        }).join(" | ");
                        window.__logs.push(level + ": " + msg);
                        if (window.__logs.length > 200) window.__logs.shift();
                    } catch (e) {}
                    orig[level].apply(null, arguments);
                };
            });
            window.addEventListener("error", function (e) {
                window.__logs.push("window.onerror: " + (e.message || e.filename));
            });
            window.addEventListener("unhandledrejection", function (e) {
                window.__logs.push("unhandledrejection: " +
                    ((e.reason && (e.reason.message || String(e.reason))) || ""));
            });
        })();
    </script>
    <div id="loading">正在加载 Workbench Demo…（gpui web 需要浏览器支持 WebGPU）</div>
    <!-- gpui_web 会在启动后自行创建并挂载 <canvas> -->

<script type="module">
import init, * as bindings from '/product-web-6c8905c1470d71fa.js';
const wasm = await init({ module_or_path: '/product-web-6c8905c1470d71fa_bg.wasm' });


window.wasmBindings = bindings;


dispatchEvent(new CustomEvent("TrunkApplicationStarted", {detail: {wasm}}));

</script><script>"use strict";

(function () {

    const address = '{{__TRUNK_ADDRESS__}}';
    const base = '{{__TRUNK_WS_BASE__}}';
    let protocol = '';
    protocol =
        protocol
            ? protocol
            : window.location.protocol === 'https:'
                ? 'wss'
                : 'ws';
    const url = protocol + '://' + address + base + '.well-known/trunk/ws';

    class Overlay {
        constructor() {
            // create an overlay
            this._overlay = document.createElement("div");
            const style = this._overlay.style;
            style.height = "100vh";
            style.width = "100vw";
            style.position = "fixed";
            style.top = "0";
            style.left = "0";
            style.backgroundColor = "rgba(222, 222, 222, 0.5)";
            style.fontFamily = "sans-serif";
            // not sure that's the right approach
            style.zIndex = "1000000";
            style.backdropFilter = "blur(1rem)";

            const container = document.createElement("div");
            // center it
            container.style.position = "absolute";
            container.style.top = "30%";
            container.style.left = "15%";
            container.style.maxWidth = "85%";

            this._title = document.createElement("div");
            this._title.innerText = "Build failure";
            this._title.style.paddingBottom = "2rem";
            this._title.style.fontSize = "2.5rem";

            this._message = document.createElement("div");
            this._message.style.whiteSpace = "pre-wrap";

            const icon= document.createElement("div");
            icon.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" fill="#dc3545" viewBox="0 0 16 16"><path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/></svg>';
            this._title.prepend(icon);

            container.append(this._title, this._message);
            this._overlay.append(container);

            this._inject();
            window.setInterval(() => {
                this._inject();
            }, 250);
        }

        set reason(reason) {
            this._message.textContent = reason;
        }

        _inject() {
            if (!this._overlay.isConnected) {
                // prepend it
                document.body?.prepend(this._overlay);
            }
        }

    }

    class Client {
        constructor(url) {
            this.url = url;
            this.poll_interval = 5000;
            this._overlay = null;
        }

        start() {
            const ws = new WebSocket(this.url);
            ws.onmessage = (ev) => {
                const msg = JSON.parse(ev.data);
                switch (msg.type) {
                    case "reload":
                        this.reload();
                        break;
                    case "buildFailure":
                        this.buildFailure(msg.data)
                        break;
                }
            };
            ws.onclose = () => this.onclose();
        }

        onclose() {
            window.setTimeout(
                () => {
                    // when we successfully reconnect, we'll force a
                    // reload (since we presumably lost connection to
                    // trunk due to it being killed, so it will have
                    // rebuilt on restart)
                    const ws = new WebSocket(this.url);
                    ws.onopen = () => window.location.reload();
                    ws.onclose = () => this.onclose();
                },
                this.poll_interval);
        }

        reload() {
            window.location.reload();
        }

        buildFailure({reason}) {
            // also log the console
            console.error("Build failed:", reason);

            console.debug("Overlay", this._overlay);

            if (!this._overlay) {
                this._overlay = new Overlay();
            }
            this._overlay.reason = reason;
        }
    }

    new Client(url).start();

})()
</script></body>

</html>

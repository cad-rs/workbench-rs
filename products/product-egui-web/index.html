<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Workbench Demo - egui (Web)</title>

    <!-- Copy assets/ (optional CJK fallback font: assets/fonts/cjk.ttf) into dist/ -->
    <link data-trunk rel="copy-dir" href="assets" />

    <style>
        html,
        body {
            margin: 0;
            height: 100%;
            background: #292b30;
            overflow: hidden;
        }

        /* The canvas fills the window; eframe resizes it via ResizeObserver. */
        #wb-canvas {
            width: 100%;
            height: 100%;
            display: block;
            outline: none;
        }

        /* Visible until the first egui frame paints over the canvas. */
        #loading {
            position: fixed;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #a0a5af;
            font-family: "Segoe UI", system-ui, sans-serif;
            font-size: 14px;
            z-index: 0;
        }

        #wb-canvas {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>
    <div id="loading">正在加载 Workbench Demo…（首次编译需等待 wasm 下载与初始化）</div>
    <canvas id="wb-canvas" tabindex="0"></canvas>
</body>

</html>
